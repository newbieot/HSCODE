<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Fill HS Code Barang Pindahan</title>
    <!-- Memuat Library SheetJS untuk membaca/menulis Excel dari browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #ff6600; /* Warna aksen Pos */
            margin-top: 0;
        }
        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            border: 2px dashed #ccc;
            display: inline-block;
            padding: 20px 40px;
            cursor: pointer;
            border-radius: 8px;
            background-color: #fafafa;
            font-weight: bold;
            color: #555;
            transition: 0.3s;
            width: 80%;
        }
        .custom-file-upload:hover {
            border-color: #ff6600;
            background-color: #fff5eb;
        }
        .btn-download {
            margin-top: 25px;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* Disembunyikan sampai file siap */
            text-decoration: none;
            transition: 0.3s;
            width: 100%;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📦 Auto-Fill HS Code CIPL</h2>
        <p>Upload file Excel (Packing List / CIPL) Anda. Sistem otomatis membaca kolom <b>NAMA BARANG</b> dan mengisi <b>HSCODE</b> yang kosong.</p>
        
        <label for="fileUpload" class="custom-file-upload" id="uploadLabel">
            📁 Klik untuk Pilih File Excel (.xlsx)
        </label>
        <input type="file" id="fileUpload" accept=".xlsx, .xls" />

        <div id="status"></div>

        <button id="downloadBtn" class="btn-download">⬇️ Download File Excel yang Sudah Diisi</button>
    </div>

    <script>
        // Database Kamus HS Code Akurat
        const hsMapping = {
            'PAKAIAN': '6109.10',
            'TV': '8528.72',
            'MEJA LIPAT': '9403.20',
            'RAKET': '9506.51',
            'HANDUK': '6302.60',
            'SPEAKER TV': '8518.22',
            'SET TOP BOX': '8528.71',
            'KABEL': '8544.42',
            'TOPI': '6505.00',
            'JAM BEKER': '9105.11',
            'BODY LOTION': '3304.99',
            'MAINAN': '9503.00',
            'BONEKA': '9503.00',
            'TAS': '4202.22',
            'MATRAS OLAHRAGA': '9506.91',
            'AKSESORIS': '7117.90',
            'MAGIG COM': '8516.60',
            'LAPTOP BEKAS': '8471.30',
            'HANGER': '3924.90',
            'BUKU': '4901.99',
            'ATK': '3926.10',
            'DOKUMEN': '4901.10',
            'SEPATU': '6403.99',
            'SENDAL': '6402.99',
            'BOTOL MINUM': '3924.10',
            'MAKANAN': '2106.90',
            'SAJADAH': '5705.00',
            'TEMPAT SAMPAH': '3924.90',
            'TRIPOD': '9006.91',
            'KACAMATA': '9004.10',
            'IKAT PINGGANG': '4203.30',
            'PAYUNG': '6601.99',
            'PERALATAN OLAHRAGA': '9506.99',
            'TIMBANGAN BADAN': '8423.10',
            'SETRIKA UAP': '8516.40',
            'PALU': '8205.20',
            'RAK SEPATU': '9403.20'
        };

        let processedWorkbook;
        let originalFileName = "";

        document.getElementById('fileUpload').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if(!file) return;

            originalFileName = file.name.split('.')[0];
            document.getElementById('uploadLabel').innerText = "📄 File Terpilih: " + file.name;
            let statusEl = document.getElementById('status');
            statusEl.innerHTML = "Memproses data...";
            statusEl.className = "";
            document.getElementById('downloadBtn').style.display = 'none';

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, {type: 'array'});

                    // Mengambil sheet pertama
                    let firstSheetName = workbook.SheetNames[0];
                    let worksheet = workbook.Sheets[firstSheetName];

                    // Konversi sheet ke array 2 dimensi (header: 1 agar format baris/kolom persis sama)
                    let rows = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});

                    let headerRowIdx = -1;
                    let namaBarangCol = -1;
                    let hsCodeCol = -1;

                    // Mencari letak baris yang ada tulisan "NAMA BARANG" dan "HSCODE"
                    for(let r = 0; r < rows.length; r++) {
                        let row = rows[r];
                        for(let c = 0; c < row.length; c++) {
                            if(typeof row[c] === 'string' && row[c].trim().toUpperCase() === 'NAMA BARANG') {
                                headerRowIdx = r;
                                namaBarangCol = c;
                            }
                            if(typeof row[c] === 'string' && row[c].trim().toUpperCase() === 'HSCODE') {
                                hsCodeCol = c;
                            }
                        }
                        if(headerRowIdx !== -1 && hsCodeCol !== -1) break;
                    }

                    if(headerRowIdx !== -1 && hsCodeCol !== -1) {
                        // Mulai membaca baris di bawah header
                        let itemsUpdated = 0;
                        for(let r = headerRowIdx + 1; r < rows.length; r++) {
                            let row = rows[r];
                            let namaBarang = row[namaBarangCol];
                            
                            if(namaBarang && typeof namaBarang === 'string') {
                                let key = namaBarang.trim().toUpperCase();
                                // Pastikan kolom HSCODE ada indeksnya meski sebelumnya array-nya pendek
                                while(row.length <= hsCodeCol) row.push("");
                                
                                // Jika NAMA BARANG ada di database dan HSCODE-nya kosong
                                if(hsMapping[key] && (!row[hsCodeCol] || row[hsCodeCol].toString().trim() === "")) {
                                    row[hsCodeCol] = hsMapping[key];
                                    itemsUpdated++;
                                }
                            }
                        }

                        // Kembalikan array 2 dimensi menjadi sheet
                        let newWorksheet = XLSX.utils.aoa_to_sheet(rows);
                        workbook.Sheets[firstSheetName] = newWorksheet;
                        processedWorkbook = workbook;

                        statusEl.innerHTML = `✅ Berhasil! Ditemukan dan diisi ${itemsUpdated} HS Code.`;
                        statusEl.className = "success";
                        document.getElementById('downloadBtn').style.display = 'block';

                    } else {
                        statusEl.innerHTML = "❌ Gagal: Tidak menemukan kolom 'NAMA BARANG' atau 'HSCODE' di file Excel.";
                        statusEl.className = "error";
                    }
                } catch (error) {
                    statusEl.innerHTML = "❌ Terjadi kesalahan saat membaca file: " + error.message;
                    statusEl.className = "error";
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Fungsi Eksekusi Download
        document.getElementById('downloadBtn').addEventListener('click', function() {
            if(processedWorkbook) {
                XLSX.writeFile(processedWorkbook, originalFileName + "_Terisi_HSCode.xlsx");
            }
        });
    </script>
</body>
</html>
