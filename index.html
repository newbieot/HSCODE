<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Automation HS Code - PosIND Batam</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Gantari:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --pos-cinnabar: #EF4123; /* */
            --pos-delft-blue: #1C2D5A; /* */
            --pos-bg: #F8FAFC;
        }

        body { font-family: 'Gantari', sans-serif; background: var(--pos-bg); margin: 0; padding: 0; } /*[cite: 1] */

        header {
            background: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--pos-cinnabar);
        }

        .logo-danantara { height: 40px; }
        .logo-posind { height: 35px; }

        .container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        .card { 
            background: white; padding: 40px; border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(28, 45, 90, 0.1); text-align: center;
        }

        h1 { font-family: 'Sora', sans-serif; color: var(--pos-delft-blue); font-size: 26px; margin-bottom: 10px; } /*[cite: 1] */

        /* Loading Animation */
        #searchOverlay {
            display: none;
            margin: 30px 0;
        }
        .progress-container {
            width: 100%; background: #EEE; border-radius: 10px; height: 10px; margin: 20px 0; overflow: hidden;
        }
        .progress-bar {
            width: 0%; height: 100%; background: var(--pos-cinnabar); transition: width 0.3s;
        }
        .searching-text { color: var(--pos-delft-blue); font-weight: 600; font-size: 14px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .upload-box {
            border: 2px dashed #CBD5E1; padding: 50px; border-radius: 15px; cursor: pointer; background: #FBFCFF; transition: 0.3s;
        }
        .upload-box:hover { border-color: var(--pos-cinnabar); background: #FFF9F8; }

        .btn-download {
            display: none; background: var(--pos-delft-blue); color: white; border: none;
            padding: 15px 30px; border-radius: 10px; font-weight: 700; font-family: 'Sora', sans-serif;
            cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Danantara_Indonesia_%28no_SW%29.svg/960px-Danantara_Indonesia_%28no_SW%29.svg.png" class="logo-danantara">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/POSIND_2023_%28with_wordmark%29.svg/1280px-POSIND_2023_%28with_wordmark%29.svg.png" class="logo-posind">
</header>

<div class="container">
    <div class="card">
        <h1>AI AUTOMATION HS CODE</h1>
        <p style="color: #64748B; margin-bottom: 30px;">Unit Penjualan Korporat - KCU Batam</p>

        <div id="dropZone" class="upload-box" onclick="document.getElementById('fileInput').click()">
            <p id="uploadStatus">📁 Taruh file CIPL Anda di sini</p>
            <span style="font-size: 12px; color: #94A3B8;">Format yang didukung: .xlsx</span>
            <input type="file" id="fileInput" accept=".xlsx" style="display:none">
        </div>

        <!-- Simulation Search Engine UI -->
        <div id="searchOverlay">
            <p class="searching-text">🔍 MENGANALISIS DESKRIPSI BARANG & MENCARI HS CODE...</p>
            <div class="progress-container"><div id="pBar" class="progress-bar"></div></div>
            <p id="itemStatus" style="font-size: 12px; color: #64748B;"></p>
        </div>

        <button id="dlBtn" class="btn-download" onclick="downloadResult()">⬇️ DOWNLOAD HASIL OTOMATIS</button>
    </div>
</div>

<script>
    // Database Master (Hampir Seluruh Barang Pindahan Umum)
    const MASTER_DB = {
        'PAKAIAN': '6109.10.00', 'TV': '8528.72.92', 'MEJA': '9403.20.90', 'MAINAN': '9503.00.99',
        'BONEKA': '9503.00.10', 'KARPET': '5705.00.00', 'BUKU': '4901.99.00', 'PIALA': '8306.29.00',
        'MENDALI': '7117.19.00', 'TUMBLER': '3924.10.00', 'TEMPAT PISAU': '4419.90.00', 'TOPLES': '3924.90.90',
        'BLENDER': '8509.40.00', 'TIMBANGAN': '8423.10.10', 'BINGKAI': '4414.00.00', 'PANCI': '7323.93.10',
        'DIFFUSER': '8509.80.90', 'SPEAKER': '8518.22.00', 'TREADMILL': '9506.91.00', 'KULKAS': '8418.10.11',
        'MESIN CUCI': '8450.11.90', 'DISPENSER': '8516.10.11', 'SETRIKA': '8516.40.00', 'TAS': '4202.22.00',
        'SEPATU': '6403.99.90', 'KACAMATA': '9004.10.00', 'PAYUNG': '6601.99.00', 'GORDYN': '6303.12.00'
    };

    let finalWorkbook = null;
    let originalName = "";

    document.getElementById('fileInput').onchange = function(e) {
        const file = e.target.files[0];
        if(!file) return;
        originalName = file.name;
        simulateAISearch(file);
    };

    function simulateAISearch(file) {
        document.getElementById('dropZone').style.display = 'none';
        document.getElementById('searchOverlay').style.display = 'block';
        
        let progress = 0;
        const pBar = document.getElementById('pBar');
        const itemStatus = document.getElementById('itemStatus');

        const interval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                processFile(file);
            }
            pBar.style.width = progress + "%";
            itemStatus.innerText = "Mencocokkan baris data... " + Math.floor(progress) + "%";
        }, 300);
    }

    function processFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type: 'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""});

            let headerIdx = -1, colNama = -1, colHS = -1;
            for(let r=0; r<rows.length; r++) {
                let rData = rows[r].map(v => String(v).toUpperCase().trim());
                if(rData.includes("NAMA BARANG")) {
                    headerIdx = r; colNama = rData.indexOf("NAMA BARANG"); colHS = rData.indexOf("HSCODE");
                    break;
                }
            }

            for(let r = headerIdx + 1; r < rows.length; r++) {
                let nama = String(rows[r][colNama] || "").toUpperCase();
                for (let key in MASTER_DB) {
                    if (nama.includes(key)) {
                        rows[r][colHS] = MASTER_DB[key];
                        break;
                    }
                }
            }

            const newSheet = XLSX.utils.aoa_to_sheet(rows);
            wb.Sheets[wb.SheetNames[0]] = newSheet;
            finalWorkbook = wb;

            document.getElementById('searchOverlay').style.display = 'none';
            document.getElementById('dlBtn').style.display = 'block';
        };
        reader.readAsArrayBuffer(file);
    }

    function downloadResult() {
        XLSX.writeFile(finalWorkbook, "AUTO_HSCODE_" + originalName);
        location.reload(); 
    }
</script>
</body>
</html>
